name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13.5']

    # Placeholders only. azure_services/config.py resolves every required variable at
    # import time and raises if one is missing, so the suite cannot even be collected
    # without them. No test makes a live Azure call.
    env:
      PYTHONPATH: ${{ github.workspace }}/Agentic Shiksha Platform/Backend
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      AZURE_AI_PROJECT_ENDPOINT: https://example.services.ai.azure.com/api/projects/ci
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ci-chat
      AZURE_AI_AGENT_MODEL_DEPLOYMENT: ci-agent
      AZURE_ALLOWED_DEPLOYMENTS: ci-chat,ci-agent
      AZURE_AUTH_TENANT_ID: 00000000-0000-0000-0000-000000000000
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      AGENT_IMAGES_CONTAINER: ci-agent-images
      BLOB_CONTAINER_NAME: ci-agent-files
      AZURE_BING_CUSTOM_SEARCH_INSTANCE: ci-websearch
      AZURE_IMAGE_MODEL: ci-image
      GENERATED_IMAGES_CONTAINER: ci-generated-images
      TIKZ_GENERATOR_MODEL: ci-diagram-generator
      TIKZ_DISCRIMINATOR_MODEL: ci-diagram-discriminator
      TIKZ_POLISHER_MODEL: ci-diagram-polisher
      MEMORY_CHAT_MODEL: ci-memory-chat
      MEMORY_EMBEDDING_MODEL: ci-memory-embedding
      TEXTBOOK_RESEARCH_AGENT_NAME: ci-textbook-research
      THRESHOLD_CONCEPT_RESEARCH_AGENT_NAME: ci-concept-research
      TEACHER_ANALYTICS_AGENT_NAME: ci-teacher-analytics
      PYTHON_DOTENV_DISABLED: '1'
      AZURE_AI_SEARCH_API_VERSION: 2025-11-01-preview
      AZURE_AI_SEARCH_BLOB_CONTAINER: ci-container
      AZURE_AI_SEARCH_CONNECTION_ID: /subscriptions/00000000-0000-0000-0000-000000000000/ci
      AZURE_AI_SEARCH_ENDPOINT: https://example.search.windows.net
      AZURE_AI_SEARCH_SERVICE_NAME: ci-search
      AZURE_BING_CONNECTION_ID: /subscriptions/00000000-0000-0000-0000-000000000000/ci-bing
      AZURE_BING_CUSTOM_SEARCH_CONNECTION_ID: /subscriptions/00000000-0000-0000-0000-000000000000/ci-bing-custom
      AZURE_EVAL_MODEL: gpt-4.1
      AZURE_FOUNDRY_ENDPOINT: https://example.services.ai.azure.com
      AZURE_OPENAI_CHAT_MODEL: gpt-4.1-mini
      AZURE_OPENAI_ENDPOINT: https://example.openai.azure.com
      AZURE_RESOURCE_GROUP: ci-resource-group
      AZURE_SUBSCRIPTION_ID: 00000000-0000-0000-0000-000000000000
      BING_CONNECTION_ID: /subscriptions/00000000-0000-0000-0000-000000000000/ci-bing
      COMMON_DATASOURCE_NAME: ci-datasource
      COMMON_IMAGE_CONTAINER: ci-images
      COMMON_INDEX_NAME: ci-index
      COMMON_INDEXER_NAME: ci-indexer
      COMMON_SKILLSET_NAME: ci-skillset
      COSMOS_ENDPOINT: https://example.documents.azure.com:443/
      COSMOS_DATABASE: ci-database
      DEEP_RESEARCH_AGENT_ID: ci-deep-research-agent
      DEEP_RESEARCH_BING_CONNECTION_ID: /subscriptions/00000000-0000-0000-0000-000000000000/ci-bing
      DEEP_RESEARCH_PROJECT_ENDPOINT: https://example.services.ai.azure.com/api/projects/ci
      DOCUMENT_INTELLIGENCE_ENDPOINT: https://example.cognitiveservices.azure.com
      EMBEDDING_DIMENSIONS: '1024'
      EMBEDDING_MODEL: text-embedding-3-large
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      JWT_SECRET: ci-only-not-a-real-secret
      PROJECT_ENDPOINT: https://example.services.ai.azure.com/api/projects/ci
      PROJECT_NAME: ci-project
      PROJECT_RESOURCE_ID: /subscriptions/00000000-0000-0000-0000-000000000000/ci
      STORAGE_ACCOUNT_NAME: cistorageaccount
      SUPER_ADMIN_EMAIL: admin@example.com
      VITE_AZURE_CLIENT_ID: 00000000-0000-0000-0000-000000000000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: Agentic Shiksha Platform/Backend/uv.lock

      - name: Install dependencies
        working-directory: Agentic Shiksha Platform/Backend
        run: uv sync --locked

      - name: Check dependency export and critical lint
        working-directory: Agentic Shiksha Platform/Backend
        run: |
          uv export --locked --no-dev --format requirements-txt --output-file requirements.txt --quiet
          git diff --exit-code -- requirements.txt
          uv run --frozen ruff check .

      - name: Run tests
        working-directory: Agentic Shiksha Platform/Backend
        run: uv run --frozen python -m pytest tests/ -q

  admin-backend:
    name: Admin backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13.5']
    env:
      PYTHONPATH: ${{ github.workspace }}/Admin-Dashboard/backend
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      PYTHON_DOTENV_DISABLED: '1'
      APP_ENV: test
      EVAL_ENABLED: 'false'
      COSMOS_ENDPOINT: https://example.documents.azure.com:443/
      COSMOS_DATABASE: ci-database
      PROJECT_ENDPOINT: https://example.services.ai.azure.com/api/projects/ci
      AZURE_AI_PROJECT_ENDPOINT: https://example.services.ai.azure.com/api/projects/ci
      AZURE_FOUNDRY_ENDPOINT: https://example.services.ai.azure.com
      AZURE_AI_SEARCH_ENDPOINT: https://example.search.windows.net
      STORAGE_ACCOUNT_NAME: cistorageaccount
      ALLOWED_ORIGINS: http://localhost:5174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: Admin-Dashboard/backend/uv.lock
      - name: Install independent admin dependencies
        working-directory: Admin-Dashboard/backend
        run: uv sync --locked
      - name: Check dependency export and critical lint
        working-directory: Admin-Dashboard/backend
        run: |
          uv export --locked --no-dev --format requirements-txt --output-file requirements.txt --quiet
          git diff --exit-code -- requirements.txt
          uv run --frozen ruff check .
      - name: Run independent admin tests
        working-directory: Admin-Dashboard/backend
        run: uv run --frozen python -m pytest tests/ -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Agentic Shiksha Platform/Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Agentic Shiksha Platform/Frontend
        run: npm ci

      - name: Build
        working-directory: Agentic Shiksha Platform/Frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

      - name: Install browser test runtime
        working-directory: Agentic Shiksha Platform/Frontend
        run: npx playwright install --with-deps chromium

      - name: Verify chat and persistence contracts
        working-directory: Agentic Shiksha Platform/Frontend
        run: npx playwright test chat-response.spec.ts chat-persistence.spec.ts learner-profile.spec.ts

  admin-frontend:
    name: Admin frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Admin-Dashboard/frontend/package-lock.json
      - name: Install independent admin frontend dependencies
        working-directory: Admin-Dashboard/frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: Admin-Dashboard/frontend
        run: npm run build
      - name: Install browser test runtime
        working-directory: Admin-Dashboard/frontend
        run: npx playwright install --with-deps chromium
      - name: Verify admin workflows
        working-directory: Admin-Dashboard/frontend
        run: npx playwright test

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build context is the service directory, so .dockerignore keeps .env out.
      - name: Build backend image
        run: docker build -t agentic-shiksha/backend:ci -f "Agentic Shiksha Platform/Backend/Dockerfile" "Agentic Shiksha Platform/Backend"

      - name: Build frontend image
        run: docker build --build-arg VITE_API_BASE_URL=http://localhost:8000 -t agentic-shiksha/frontend:ci -f "Agentic Shiksha Platform/Frontend/Dockerfile" "Agentic Shiksha Platform/Frontend"

      - name: Build independent admin images
        run: |
          docker build -t agentic-shiksha/admin-backend:ci -f "Admin-Dashboard/backend/Dockerfile" "Admin-Dashboard/backend"
          docker build -t agentic-shiksha/admin-frontend:ci -f "Admin-Dashboard/frontend/Dockerfile" "Admin-Dashboard/frontend"

      - name: Assert no private environment files in API images
        run: |
          for image in agentic-shiksha/backend:ci agentic-shiksha/admin-backend:ci; do
            docker run --rm --network none --entrypoint sh "$image" -ec \
              'leaks="$(find /app -path /app/.venv -prune -o -type f -name ".env*" ! -name "*.example" -print)"; test -z "$leaks" || { echo "Private environment file in image"; exit 1; }'
          done

      - name: Check frontend image configuration
        run: |
          for image in agentic-shiksha/frontend:ci agentic-shiksha/admin-frontend:ci; do
            docker run --rm --network none --entrypoint nginx "$image" -t
          done
