[project]
name = "agentic-shiksha-admin-backend"
version = "0.0.0"
description = "Independent Agentic Shiksha administration API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.120.0",
    "starlette==0.48.0",
    "uvicorn==0.54.0",
    "pydantic==2.12.3",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "azure-core==1.41.0",
    "azure-cosmos==4.14.5",
    "azure-identity==1.25.1",
    "azure-storage-blob==12.27.0",
    "azure-ai-projects==2.4.0",
    "azure-search-documents==12.0.0",
    "azure-ai-evaluation==1.18.2",
    "openai==2.54.0",
    "PyJWT==2.10.1",
    "json-repair==0.61.7",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.12.0",
]

[tool.uv]
package = false
required-version = "==0.12.18"

[[tool.uv.index]]
name = "package-mirror"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F821"]
