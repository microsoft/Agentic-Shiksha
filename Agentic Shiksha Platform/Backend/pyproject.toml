[project]
name = "agentic-shiksha-backend"
version = "0.0.0"
description = "Agentic Shiksha main API and teaching runtime"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.120.0",
    "starlette==1.7.0",
    "uvicorn==0.38.0",
    "python-multipart==0.0.32",
    "pydantic==2.12.3",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "anyio==4.11.0",
    # Preview APIs are used by the existing research and knowledge-base features.
    "azure-ai-agents==1.2.0b5",
    "azure-ai-documentintelligence==1.0.0",
    # Preserve the OpenAI 2.x-compatible project client.
    "azure-ai-projects==2.4.0",
    "azure-core==1.41.0",
    "azure-cosmos==4.14.5",
    "azure-identity==1.25.1",
    "azure-search-documents==11.7.0b2",
    "azure-storage-blob==12.25.1",
    "openai==2.54.0",
    "litellm==1.98.0",
    "aiofiles==24.1.0",
    "aiohttp==3.14.3",
    "httpx==0.28.1",
    "requests==2.32.5",
    "msal==1.34.0",
    "PyJWT==2.10.1",
    "pdf2image==1.17.0",
    "Pillow==12.3.0",
    "PyMuPDF==1.27.2.2",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "dulwich==1.2.12",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.12.0",
]

[tool.uv]
package = false
required-version = "==0.12.18"

[[tool.uv.index]]
name = "package-mirror"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
