  </g>
  </g><polyline points="725,921 725,972" fill="none" stroke="#07183A" stroke-width="2.3" stroke-linejoin="round"  marker-end="url(#03-shiksha-teaching-runtime-ink)" /><g data-card="SSE / AG-UI  &gt;  React chat, artifacts and saved conversation state">
