    <rect x="884.6" y="224" width="332.8" height="44" fill="white"/>
    <text x="1051" y="246" font-size="29" font-weight="700" fill="#07183A" text-anchor="middle" dominant-baseline="central" >AUTHORIZED INPUT</text>
