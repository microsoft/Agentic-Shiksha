  </g>
  </g><polyline points="1002,576 1078,576" fill="none" stroke="#033CF2" stroke-width="2.3" stroke-linejoin="round"  marker-end="url(#03-shiksha-teaching-runtime-blue)" marker-start="url(#03-shiksha-teaching-runtime-blue)"/><polyline points="725,664 725,762" fill="none" stroke="#07183A" stroke-width="2.3" stroke-linejoin="round"  marker-end="url(#03-shiksha-teaching-runtime-ink)" marker-start="url(#03-shiksha-teaching-runtime-ink)"/><g><rect x="842.5" y="711" width="231.00000000000003" height="38" fill="white"/><text x="958" y="730" font-size="19" font-weight="400" fill="#07183A" text-anchor="middle" dominant-baseline="central" >Tool calls + results</text></g><g data-section="TEACHING TOOLS">
