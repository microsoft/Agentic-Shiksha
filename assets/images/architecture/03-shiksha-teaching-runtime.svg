    <rect x="142" y="246" width="220" height="790" rx="10" fill="none" stroke="#07183A" stroke-width="1.3" stroke-dasharray="7 9"/>
    <text x="0" y="0" font-size="27" font-weight="700" fill="#07183A" text-anchor="middle" dominant-baseline="central" transform="translate(112 641) rotate(-90)">TURN CONTEXT</text>
    <g data-card="Course">
        <rect x="168" y="272" width="168" height="231.33333333333334" rx="12" fill="#F0F6FB"/>
        <text x="0" y="0" font-size="31" font-weight="400" fill="#07183A" text-anchor="middle" dominant-baseline="central" transform="translate(252 387.6666666666667) rotate(-90)">Course</text>
      </g><g data-card="Learner">
        <rect x="168" y="525.3333333333334" width="168" height="231.33333333333334" rx="12" fill="#F0F6FB"/>
        <text x="0" y="0" font-size="31" font-weight="400" fill="#07183A" text-anchor="middle" dominant-baseline="central" transform="translate(252 641) rotate(-90)">Learner</text>
      </g><g data-card="Conversation">
        <rect x="168" y="778.6666666666667" width="168" height="231.33333333333334" rx="12" fill="#F0F6FB"/>
        <text x="0" y="0" font-size="31" font-weight="400" fill="#07183A" text-anchor="middle" dominant-baseline="central" transform="translate(252 894.3333333333334) rotate(-90)">Conversation</text>
      </g>
  </g><g data-section="AUTHORIZED INPUT">
