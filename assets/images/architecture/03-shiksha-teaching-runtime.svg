    <text x="1051" y="307.20000000000005" font-size="33" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" >Learner question + preferences</text><text x="1051" y="351.475" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" >Active-user and course checks / answer depth / optional image and artifact context</text>
