<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="03-shiksha-teaching-runtime-title 03-shiksha-teaching-runtime-desc">
  <title id="03-shiksha-teaching-runtime-title">Agentic Shiksha: Teaching-agent runtime</title>
  <desc id="03-shiksha-teaching-runtime-desc">A learner turn passes user and course checks, enters the canonical TA harness, exchanges turns with a named Foundry agent, uses learning tools and streams results to React. SSE and AG-UI are transport adapters, not separate agents. Tool results return to the same agent turn. Graph-memory context is only injected under the configured authoritative policy. Source snapshot: 30 SEP 2026. Not a live deployment inventory.</desc>
  <defs>
    <marker id="03-shiksha-teaching-runtime-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#07183A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="03-shiksha-teaching-runtime-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#033CF2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect width="1800" height="1200" fill="white"/>
    <rect x="60" y="104" width="1680" height="1014" rx="12" fill="none" stroke="#07183A" stroke-width="1.4" stroke-dasharray="7 10"/>
    <rect data-heading-mask="" x="96" y="57" width="496" height="89" fill="white"/>
    <text x="112" y="101" font-size="41" font-weight="700" fill="#07183A" text-anchor="start" dominant-baseline="central" data-heading="">TEACHING RUNTIME</text>
    <text x="112" y="179" font-size="23" font-weight="400" fill="#07183A" text-anchor="start" dominant-baseline="central" >One course-specific TA turn: trusted context, agent execution, tools and streamed learning artifacts.</text>
