  </g><g data-card="Learning artifacts">
    <rect x="857" y="795" width="387" height="112" rx="13" fill="#CEE7FD"/>
    <text x="1050.5" y="820.8" font-size="29" font-weight="400" fill="#07183A" text-anchor="middle" dominant-baseline="central" >Learning artifacts</text><text x="1050.5" y="860.825" font-size="19" font-weight="400" fill="#07183A" text-anchor="middle" dominant-baseline="central" >Docs / quizzes / challenges</text><text x="1050.5" y="885.525" font-size="19" font-weight="400" fill="#07183A" text-anchor="middle" dominant-baseline="central" >Slides / diagrams / circuits</text>
