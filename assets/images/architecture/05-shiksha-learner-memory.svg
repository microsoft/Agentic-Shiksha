    <text x="305" y="339.2" font-size="30" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" >Published graph</text><text x="305" y="381.09999999999997" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" >Threshold concepts</text><text x="305" y="408.4" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" >Misconceptions + probes</text>
