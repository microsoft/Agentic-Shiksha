<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="05-shiksha-learner-memory-title 05-shiksha-learner-memory-desc">
  <title id="05-shiksha-learner-memory-title">Agentic Shiksha: Learner memory and evidence</title>
  <desc id="05-shiksha-learner-memory-desc">A reviewed curriculum graph and policies constrain event processing. Durable learner events produce evidence and validated observations, followed by a deterministic reducer, an atomic snapshot and derived learning views. Disabled by default. Course modes are off, shadow and authoritative. Shadow writes evidence without becoming progress authority; authoritative mode supplies TA context and learning-state authority. Cosmos stores graph documents; no separate graph database is required. Hosted memory and legacy progress are not the evidence ledger. Source snapshot: 30 SEP 2026. Not a live deployment inventory.</desc>
  <defs>
    <marker id="05-shiksha-learner-memory-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#07183A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="05-shiksha-learner-memory-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#033CF2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
