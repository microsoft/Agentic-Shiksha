<title id="title">Agentic Shiksha: Shared knowledge. Personal memory.</title><desc id="desc">Two connected graphs: shared threshold concepts TC1 and TC2 link to one common misconception MC3. Learner L1 has separate concept and misconception states, sessions, and evidence E12 and E19. Stable IDs connect states to definitions; evidence informs observations and state policy, not automatic mastery. Conceptual view. State labels are illustrative; evidence and interpretation remain separate.</desc>
