<title id="title">Agentic Shiksha: One misconception. Multiple concepts.</title><desc id="desc">TC1, complete circuits, is a prerequisite of TC2, current conservation. Each concept has its own misconception and both connect to MC3, the mistaken idea that current is used up. MC3 is one shared definition, not two copies. Shared curriculum definitions are not claims about an individual learner.</desc>
