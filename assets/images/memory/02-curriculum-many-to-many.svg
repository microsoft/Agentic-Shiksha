acity="0.97"/><text x="260" y="552" font-size="20" fill="#536580" font-weight="400" text-anchor="middle">has misconception</text></g><g data-edge-label=""><rect x="556.2" y="548" width="203.60000000000002" height="28" rx="6" fill="#FFFFFF" fill-opacity="0.97"/><text x="658" y="566" font-size="20" fill="#087B78" font-weight="400" text-anchor="middle">has misconception</text></g><g data-edge-label=""><rect x="840.2" y="548" width="203.60000000000002" height="28" rx="6" fill="#FFFFFF" fill-opacity="0.97"/><text x="942" y="566" font-size="20" fill="#087B78" font-weight="400" text-anchor="middle">has misconception</text></g><g data-edge-label=""><rect x="1238.2" y="534" width="203.60000000000002" height="28" rx="6" fill="#FFFFFF" fill-opacity="0.97"/><text x="1340" y="552" font-size="20" fill="#536580" font-weight="400" text-anchor="middle">has misconception</text></g><rect x="76" y="237" width="337.4" height="32" rx="10" fill="#EDF3FF" stroke="#EDF3FF" stroke-width="1.5"/><text x="91" y="259" font-size="17" fill="#2454C6" font-weight="700" text-anchor="start">CURRICULUM / SHARED KNOWLEDGE</text><g data-node="TC1" data-type="ThresholdConcept"><title>TC1: Complete: circuits</title><circle data-body="" cx="485" cy="401" r="90" fill="#2454C6" stroke="#2454C6" stroke-width="3"/><text x="485" y="381" font-size="34" fill="#FFFFFF" font-weight="700" text-anchor="middle">TC1</text><text x="485" y="415" font-size="23" fill="#FFFFFF" font-weight="400" text-anchor="middle">Complete</text><text x="485" y="442" font-size="23" fill="#FFFFFF" font-weight="400" text-anchor="middle">circuits</text></g><g data-node="TC2" data-type="ThresholdConcept"><title>TC2: Current: conservation</title><circle data-body="" cx="1115" cy="401" r="90" fill="#2454C6" stroke="#2454C6" stroke-width="3"/><text x="1115" y="381" font-size="34" fill="#FFFFFF" font-weight="700" text-anchor="middle">TC2</text><text x="1115" y="415" font-size="23" fill="#FFFFFF" font-weight="400" text-anchor="middle">Current</text><text x="1115" y="442" font-size="23" fill="#FFFFFF" font-weight="400" text-anchor="middle">conservation</text></g><g data-node="MC1" data-type="MisconceptionDefinition"><title>MC1: A single wire: is enough</title><circle data-body="" cx="336" cy="690" r="36" fill="#FFFFFF" stroke="#2454C6" stroke-width="2.5"/><text x="336" y="698" font-size="24" fill="#2454C6" font-weight="700" text-anchor="middle">MC1</text><text x="336" y="755" font-size="22" fill="#132440" font-weight="400" text-anchor="middle">A single wire</text><text x="336" y="781" font-size="22" fill="#132440" font-weight="400" text-anchor="middle">is enough</text></g><g data-node="MC3" data-type="MisconceptionDefinition"><title>MC3: Current is: used up</title><circle cx="800" cy="690" r="49" fill="#E8F6F2" stroke="none"/><circle data-body="" cx="800" cy="690" r="36" fill="#FFFFFF" stroke="#087B78" stroke-width="2.5"/><text x="800" y="698" font-size="24" fill="#087B78" font-weight="700" text-anchor="middle">MC3</text><text x="800" y="755" font-size="22" fill="#132440" font-weight="400" text-anchor="middle">Current is</text><text x="800" y="781" font-size="22" fill="#132440" font-weight="400" text-anchor="middle">used up</text></g><g data-node="MC2" data-type="MisconceptionDefinition"><title>MC2: Voltage equals: current</title><circle data-body="" cx="1264" cy="690" r="36" fill="#FFFFFF" stroke="#2454C6" stroke-width="2.5"/><text x="1264" y="698" font-size="24" fill="#2454C6" font-weight="700" text-anchor="middle">MC2</text><text x="1264" y="755" font-size="22" fill="#132440" font-weight="400" text-anchor="middle">Voltage equals</text><text x="1264" y="781" font-size="22" fill="#132440" font-weight="400" text-anchor="middle">current</text></g><rect x="352" y="888" width="896" height="62" rx="18" fill="#E8F6F2" stroke="#E8F6F2" stroke-width="1.5"/><text x="800" y="928" font-size="26" fill="#087B78" font-weight="700" text-anchor="middle">Two links. One definition. No duplicated misconception.</text>
