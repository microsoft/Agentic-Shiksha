<title id="title">Agentic Shiksha: Evidence is not an interpretation.</title><desc id="desc">Three synthetic sessions retain evidence E12, E19 and E26 separately from interpretations O12, O19 and O26. Supporting and contradicting observations inform misconception and concept states. A proposed read-only Insights Agent cites the evidence in a revisable hypothesis, not a mastery verdict. Interpretations can change. Evidence stays traceable. The proposed agent cannot assign mastery.</desc>
