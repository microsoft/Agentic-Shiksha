<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="grounding-title grounding-description">
      <title id="grounding-title">Materials become usable course context.</title><desc id="grounding-description">The common indexing path uses Document Intelligence Layout, Azure OpenAI embeddings and Azure AI Search. Retrieval checks the course/material-session scope. TA creation, material readiness and curriculum readiness are separate states. Current phase: Return grounded passages. Illustrative timing, not a latency benchmark.</desc>
