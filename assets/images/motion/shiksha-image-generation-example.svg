<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title description">
  <title id="title">Sunlight into moving water</title>
  <desc id="description">Original synthetic tutorial illustration of sunlight reaching solar panels, electrical energy powering a motor and pump, and water flowing to crops. This is a conceptual illustration, not a wiring diagram or live model output.</desc>
