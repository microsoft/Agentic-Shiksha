<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="memory-title memory-description">
      <title id="memory-title">Evidence changes state. Not confidence.</title><desc id="memory-description">This is the custom learner-memory pipeline, not hosted conversational recall. A reviewed curriculum constrains interpretation and reduction. Shadow mode records graph state while legacy progress retains authority; authoritative mode uses the committed graph state. Rejected or pending processing preserves the last complete snapshot. Current phase: Publish and inform the next turn. Illustrative timing, not a latency benchmark.</desc>
      <defs><marker id="memory-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#AEB7C8" stroke-width="1.5"/></marker></defs>
      <rect x="0" y="0" width="1280" height="720" rx="0" fill="#FBFCFE"  />
      <text x="40" y="110" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >Evidence changes state. Not confidence.</text>
      <text x="40" y="160" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667085" text-anchor="start" dominant-baseline="central" >Opt-in graph memory: the feature and its worker default to off. Shown for configured courses.</text><rect x="40" y="205" width="270" height="359" rx="20" fill="#E5F5EE" stroke="#E2E6EE" stroke-width="1.4" /><circle cx="67" cy="233" r="12" fill="#FFFFFF" /><text x="67" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#667085" text-anchor="middle" dominant-baseline="central" >1</text><text x="88" y="233" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >EVIDENCE INTAKE</text><g transform="translate(64 278) scale(1.0714285714285714)"><path d="M 5 2 H 17 L 24 9 V 27 H 5 Z M 17 2 V 9 H 24" fill="none" stroke="#147D64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 10 14 H 19 M 10 19 H 19 M 10 23 H 16" fill="none" stroke="#147D64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-fit="Durable event" data-x="61" data-y="330" data-w="227" data-h="99"><rect x="61" y="330" width="227" height="99" rx="12" fill="#FFFFFF"   /><text x="79" y="354" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >Durable event</text><text x="79" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start" dominant-baseline="central" >Source evidence + receipt</text><text x="79" y="401" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start" dominant-baseline="central" >Learner / course scope</text></g><g data-fit="Async processing" data-x="61" data-y="453" data-w="227" data-h="82"><rect x="61" y="453" width="227" height="82" rx="12" fill="#FFFFFF"   /><text x="79" y="477" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >Async processing</text><text x="79" y="505" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start" dominant-baseline="central" >Pending is not committed</text></g><rect x="350" y="205" width="270" height="359" rx="20" fill="#FFF4D8" stroke="#E2E6EE" stroke-width="1.4" /><circle cx="377" cy="233" r="12" fill="#FFFFFF" /><text x="377" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#667085" text-anchor="middle" dominant-baseline="central" >2</text><text x="398" y="233" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >INTERPRET + VALIDATE</text><g transform="translate(374 278) scale(1.0714285714285714)"><circle cx="11" cy="11" r="8" fill="none" stroke="#A27622" stroke-width="2"/><path d="M 18 18 L 26 26" fill="none" stroke="#A27622" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></g><g data-fit="LLM observations" data-x="371" data-y="330" data-w="227" data-h="88"><rect x="371" y="330" width="227" height="88" rx="12" fill="#FFFFFF"   /><text x="389" y="354" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >LLM observations</text><text x="389" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start" dominant-baseline="central" >Propose, do not commit</text></g><path d="M 484 418 L 484 454" fill="none" stroke="#AEB7C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#memory-arrow)" /><g data-fit="Validate provenance" data-x="371" data-y="454" data-w="227" data-h="81"><rect x="371" y="454" width="227" height="81" rx="12" fill="#FFFFFF"   /><text x="389" y="478" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >Validate provenance</text><text x="389" y="506" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start" dominant-baseline="central" >Reject unsupported claims</text></g><rect x="660" y="205" width="270" height="359" rx="20" fill="#EEEAFE" stroke="#E2E6EE" stroke-width="1.4" /><circle cx="687" cy="233" r="12" fill="#FFFFFF" /><text x="687" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#667085" text-anchor="middle" dominant-baseline="central" >3</text><text x="708" y="233" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >DETERMINISTIC POLICY</text><g transform="translate(684 278) scale(1.0714285714285714)"><path d="M 14 2 L 25 6 V 14 Q 25 22 14 28 Q 3 22 3 14 V 6 Z M 8 14 L 12 18 L 20 10" fill="none" stroke="#5346E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g data-fit="State reduction" data-x="681" data-y="330" data-w="227" data-h="100"><rect x="681" y="330" width="227" height="100" rx="12" fill="#5346E8"   /><text x="699" y="354" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start" dominant-baseline="central" >State reduction</text><text x="699" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#EEEAFE" text-anchor="start" dominant-baseline="central" >Reviewed curriculum</text><text x="699" y="401" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#EEEAFE" text-anchor="start" dominant-baseline="central" >+ accepted evidence</text></g><g data-fit="State transitions" data-x="681" data-y="454" data-w="227" data-h="81"><rect x="681" y="454" width="227" height="81" rx="12" fill="#FFFFFF"   /><text x="699" y="478" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >State transitions</text><text x="699" y="506" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start" dominant-baseline="central" >No direct model state writes</text></g><rect x="970" y="205" width="270" height="359" rx="20" fill="#EAF2FA" stroke="#5346E8" stroke-width="1.4" style="stroke-width:2.5"/><circle cx="997" cy="233" r="12" fill="#5346E8" /><text x="997" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central" >4</text><text x="1018" y="233" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >PUBLISH + PROJECT</text><g transform="translate(994 278) scale(1.0714285714285714)"><ellipse cx="14" cy="6" rx="11" ry="4" fill="none" stroke="#3879A5" stroke-width="2"/><path d="M 3 6 V 22 C 3 28 25 28 25 22 V 6 M 3 14 C 3 20 25 20 25 14" fill="none" stroke="#3879A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g data-fit="Atomic publication" data-x="991" data-y="330" data-w="227" data-h="89"><rect x="991" y="330" width="227" height="89" rx="12" fill="#FFFFFF" stroke="#5346E8" stroke-width="1.4" style="stroke-width:2" /><text x="1009" y="354" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >Atomic publication</text><text x="1009" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start" dominant-baseline="central" >Snapshot + history + receipt</text></g><g data-fit="LearningProfile" data-x="991" data-y="439" data-w="227" data-h="68"><rect x="991" y="439" width="227" height="68" rx="12" fill="#FFFFFF" stroke="#5346E8" stroke-width="1.4" style="stroke-width:2" /><text x="1009" y="463" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >LearningProfile</text><text x="1009" y="491" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start" dominant-baseline="central" >Derived, bounded context</text></g><text x="992" y="539" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#346487" text-anchor="start" dominant-baseline="central" >State, gaps, and next probe</text><path d="M 310 382 L 350 382" fill="none" stroke="#AEB7C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#memory-arrow)" stroke-dasharray="5 6"/><path d="M 620 382 L 660 382" fill="none" stroke="#AEB7C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#memory-arrow)" stroke-dasharray="5 6"/><path d="M 930 382 L 970 382" fill="none" stroke="#5346E8" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#memory-arrow)" stroke-dasharray="5 6"/><g data-signal=""><circle cx="962.348" cy="382" r="8" fill="#5346E8" opacity=".15"/><circle cx="962.348" cy="382" r="4" fill="#5346E8" /></g><g data-fit="Supporting architecture note" data-x="40" data-y="587" data-w="1200" data-h="34"><rect x="40" y="587" width="1200" height="34" rx="8" fill="#FFF4D8"  /><text x="59" y="604" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#74561F" text-anchor="start" dominant-baseline="central" >Opt-in only / Rejected or pending work preserves the last complete snapshot. Confidence is not mastery.</text></g>
      <rect x="40" y="640" width="1200" height="45" rx="10" fill="#EEEAFE"  />
      <text x="60" y="662" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#403882" text-anchor="start" dominant-baseline="central" >04 / Publish snapshot and history atomically; derive bounded context, gaps, and next probes.</text>
