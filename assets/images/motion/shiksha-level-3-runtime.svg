<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="runtime-title runtime-description">
      <title id="runtime-title">Inside a single teaching turn.</title><desc id="runtime-description">This follows the canonical streaming path. Graph context is conditional. The harness, Foundry agent, local tools and transport adapters have separate jobs; SSE, AG-UI and A2UI are not extra teaching agents. Current phase: Coordinate agent and tools. Illustrative timing, not a latency benchmark.</desc>
      <defs><marker id="runtime-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#AEB7C8" stroke-width="1.5"/></marker></defs>
      <rect x="0" y="0" width="1280" height="720" rx="0" fill="#FBFCFE"  />
      <text x="40" y="110" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >Inside a single teaching turn.</text>
      <text x="40" y="160" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667085" text-anchor="start" dominant-baseline="central" >From a typed request to scoped context, tool orchestration, and a streamed response.</text><rect x="40" y="205" width="270" height="359" rx="20" fill="#E5F5EE" stroke="#E2E6EE" stroke-width="1.4" /><circle cx="67" cy="233" r="12" fill="#FFFFFF" /><text x="67" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#667085" text-anchor="middle" dominant-baseline="central" >1</text><text x="88" y="233" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >REQUEST + ACCESS</text><g transform="translate(64 278) scale(1.0714285714285714)"><path d="M 14 2 L 25 6 V 14 Q 25 22 14 28 Q 3 22 3 14 V 6 Z M 8 14 L 12 18 L 20 10" fill="none" stroke="#147D64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g data-fit="Typed chat route" data-x="61" data-y="332" data-w="227" data-h="100"><rect x="61" y="332" width="227" height="100" rx="12" fill="#FFFFFF"   /><text x="79" y="356" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202941" text-anchor="start" dominant-baseline="central" >Typed chat route</text><text x="79" y="384" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start" dominant-baseline="central" >Active user + course access</text><text x="79" y="403" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start" dominant-baseline="central" >Turn and conversation scope</text></g><g data-fit="Question + optional images" data-x="61" data-y="454" data-w="227" data-h="30"><rect x="61" y="454" width="227" height="30" rx="15" fill="#D7EDE5"  /><text x="174.5" y="469" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="