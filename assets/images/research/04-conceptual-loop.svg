<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="652" viewBox="0 0 1460 652" role="img" aria-labelledby="conceptual-loop-title conceptual-loop-desc">
    <title id="conceptual-loop-title">Agentic Shiksha: the learner feedback loop</title>
    <desc id="conceptual-loop-desc">Six components: Learner to Evidence to Learner Model to Teaching Strategy to the course Teaching Assistant and back to Learner. A teacher-reviewed course map grounds strategy and teaching. The Course TA is the learner-facing named agent; the other components are responsibilities, not extra agents or services. Source snapshot 2026-09-30. Original service-style glyphs, not official service logos. Logical source architecture, not a live deployment inventory.</desc>
    <defs><marker id="conceptual-loop-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#345EB4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="conceptual-loop-teal" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#087D78" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="conceptual-loop-violet" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#7950AC" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="conceptual-loop-amber" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#A86B21" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="conceptual-loop-red" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#AD454F" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="conceptual-loop-muted" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#526176" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker>
    </defs>
    <g font-family="'Segoe UI', Arial, sans-serif"><rect x="0" y="0" width="1460" height="652" rx="0" fill="#FAFAF6" stroke="none" stroke-width="1.8"  /><text x="40" y="100" font-size="42" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Learn from the learner. Then teach differently.</text><text x="40" y="151" font-size="25" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >A feedback loop around understanding, not just the next answer.</text><g data-node="Learner" data-fit="Learner">
      <rect x="40" y="188" width="244" height="188" rx="17" fill="#FFFFFF" stroke="#345EB4" stroke-width="1.8"  data-bounds=""/>
      
      <text x="66" y="272" font-size="24" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Learner</text>
      <text x="66" y="312" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Attempts, predicts</text><text x="66" y="344" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >and explains</text>
      
    </g><g aria-hidden="true" transform="translate(65 207) scale(0.5625)" color="#345EB4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="16" r="10"/><path d="M11 57V46C11 29 53 29 53 46V57M23 40V57M41 40V57"/></g><text x="255" y="225" font-size="22" font-weight="650" fill="#345EB4" text-anchor="end" dominant-baseline="central" >01</text><polyline data-connector="Learner to Evidence" points="284,282 324,282" fill="none" stroke="#087D78" stroke-width="3" stroke-linejoin="round"  marker-end="url(#conceptual-loop-teal)"/><g data-node="Evidence" data-fit="Evidence">
      <rect x="324" y="188" width="244" height="188" rx="17" fill="#FFFFFF" stroke="#087D78" stroke-width="1.8"  data-bounds=""/>
      
      <text x="350" y="272" font-size="24" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Evidence</text>
      <text x="350" y="312" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Traceable responses</text><text x="350" y="344" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >and observations</text>
      
    </g><g aria-hidden="true" transform="translate(349 207) scale(0.5625)" color="#087D78" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6H50V57L44 52L38 57L32 52L26 57L20 52L14 57ZM23 18H41M23 27H41M23 36H32"/><path d="M35 40L40 45L49 33"/></g><text x="539" y="225" font-size="22" font-weight="650" fill="#087D78" text-anchor="end" dominant-baseline="central" >02</text><polyline data-connector="Evidence to Learner model" points="568,282 608,282" fill="none" stroke="#087D78" stroke-width="3" stroke-linejoin="round"  marker-end="url(#conceptual-loop-teal)"/><g data-node="Learner model" data-fit="Learner model">
      <rect x="608" y="188" width="244" height="188" rx="17" fill="#FFFFFF" stroke="#7950AC" stroke-width="1.8"  data-bounds=""/>
      
      <text x="634" y="272" font-size="24" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Learner model</text>
      <text x="634" y="312" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Concepts, gaps</text><text x="634" y="344" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >and trajectory</text>
      
    </g><g aria-hidden="true" transform="translate(633 207) scale(0.5625)" color="#7950AC" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17L47 15M18 21L30 44M45 20L34 44"/><circle cx="12" cy="17" r="7"/><circle cx="51" cy="15" r="7"/><circle cx="32" cy="51" r="7"/></g><text x="823" y="225" font-size="22" font-weight="650" fill="#7950AC" text-anchor="end" dominant-baseline="central" >03</text><polyline data-connector="Learner model to Teaching strategy" points="852,282 892,282" fill="none" stroke="#087D78" stroke-width="3" stroke-linejoin="round"  marker-end="url(#conceptual-loop-teal)"/><g data-node="Teaching strategy" data-fit="Teaching strategy">
      <rect x="892" y="188" width="244" height="188" rx="17" fill="#FFFFFF" stroke="#7950AC" stroke-width="1.8"  data-bounds=""/>
      
      <text x="918" y="272" font-size="24" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Teaching strategy</text>
      <text x="918" y="312" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Choose a useful</text><text x="918" y="344" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >next learning move</text>
      
    </g><g aria-hidden="true" transform="translate(917 207) scale(0.5625)" color="#7950AC" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 5L59 32L32 59L5 32ZM21 32L29 40L45 23"/></g><text x="1107" y="225" font-size="22" font-weight="650" fill="#7950AC" text-anchor="end" dominant-baseline="central" >04</text><polyline data-connector="Teaching strategy to Course TA" points="1136,282 1176,282" fill="none" stroke="#087D78" stroke-width="3" stroke-linejoin="round"  marker-end="url(#conceptual-loop-teal)"/><g data-node="Course TA" data-fit="Course TA">
      <rect x="1176" y="188" width="244" height="188" rx="17" fill="#FFFFFF" stroke="#345EB4" stroke-width="1.8"  data-bounds=""/>
      
      <text x="1202" y="272" font-size="24" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Course TA</text>
      <text x="1202" y="312" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Guide, probe</text><text x="1202" y="344" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >and give feedback</text>
      
    </g><g aria-hidden="true" transform="translate(1201 207) scale(0.5625)" color="#345EB4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 5L55 18V46L32 59L9 46V18ZM9 18L32 32L55 18M32 32V59"/><path d="M22 12L44 25V39" opacity=".55"/><circle cx="32" cy="32" r="6" fill="currentColor" stroke="none"/></g><text x="1391" y="225" font-size="22" font-weight="650" fill="#345EB4" text-anchor="end" dominant-baseline="central" >05</text><g data-node="Reviewed course map" data-fit="Reviewed course map">
      <rect x="608" y="424" width="812" height="96" rx="17" fill="#FFFFFF" stroke="#7950AC" stroke-width="1.8" stroke-dasharray="7 6" data-bounds=""/>
      <g aria-hidden="true" transform="translate(633 447) scale(0.625)" color="#345EB4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 13C18 10 25 13 32 18C39 13 46 10 55 13V50C46 47 39 49 32 54C25 49 18 47 9 50Z"/><path d="M32 18V54M17 22L25 25M17 31L25 34M39 25L47 22M39 34L47 31"/></g>
      <text x="690" y="454" font-size="28" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Teacher-reviewed course map</text>
      <text x="634" y="493" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Threshold concepts, misconceptions, materials and approved probes</text>
      
    </g><polyline data-connector="Course map informs strategy" points="1014,424 1014,376" fill="none" stroke="#7950AC" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#conceptual-loop-violet)"/><polyline data-connector="Course map grounds teaching" points="1298,424 1298,376" fill="none" stroke="#7950AC" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#conceptual-loop-violet)"/><polyline data-connector="Teaching returns to the learner" points="1420,282 1440,282 1440,576 162,576 162,376" fill="none" stroke="#087D78" stroke-width="3" stroke-linejoin="round"  marker-end="url(#conceptual-loop-teal)"/><text x="755" y="550" font-size="24" font-weight="600" fill="#087D78" text-anchor="middle" dominant-baseline="central" >Another attempt. New evidence. A different next move.</text><text x="40" y="622" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Conceptual loop. Graph memory is opt-in; validated evidence and policy govern committed state.</text></g>
  </svg>
