<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="910" viewBox="0 0 1460 910" role="img" aria-labelledby="learner-memory-title learner-memory-desc">
    <title id="learner-memory-title">A learner-memory graph with inspectable evidence and trajectory</title>
    <desc id="learner-memory-desc">Synthetic simple-path example. Concept TC-paths has misconception M-repeat, the belief that a simple path may repeat a vertex if no edge repeats. Two earlier independent supporting records and one later reasoned counter-evidence record produce RESOLVING with IMPROVING trend under the example&apos;s stated assumptions. Threshold state is CANDIDATE, not CROSSED. P-path-B is a proposed next independent diagnostic, not completed evidence. Source snapshot 2026-09-30. Original service-style glyphs, not official service logos. Logical source architecture, not a live deployment inventory.</desc>
    <defs><marker id="learner-memory-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#345EB4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="learner-memory-teal" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#087D78" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="learner-memory-violet" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#7950AC" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="learner-memory-amber" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#A86B21" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="learner-memory-red" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#AD454F" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="learner-memory-muted" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#526176" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker>
    </defs>
    <g font-family="'Segoe UI', Arial, sans-serif"><rect x="0" y="0" width="1460" height="910" rx="0" fill="#FAFAF6" stroke="none" stroke-width="1.8"  /><text x="40" y="100" font-size="42" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Remember the change, not just the chat.</text><text x="40" y="151" font-size="25" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Concepts + misconceptions + evidence + a learning trajectory.</text><g data-node="Concept TC-paths" data-fit="Concept TC-paths">
      <rect x="328" y="200" width="568" height="88" rx="17" fill="#FFFFFF" stroke="#345EB4" stroke-width="1.8"  data-bounds=""/>
      
      <text x="354" y="229" font-size="28" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Concept / TC-paths</text>
      <text x="354" y="264" font-size="25" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Simple paths</text>
      
    </g><g data-node="Misconception M-repeat" data-fit="Misconception M-repeat">
      <rect x="328" y="355" width="568" height="144" rx="17" fill="#FFFFFF" stroke="#7950AC" stroke-width="1.8"  data-bounds=""/>
      
      <text x="354" y="383" font-size="28" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Misconception / M-repeat</text>
      <text x="354" y="426" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >A simple path may repeat a vertex</text><text x="354" y="462" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >if no edge repeats.</text>
      
    </g><g data-node="Earlier supporting evidence" data-fit="Earlier supporting evidence">
      <rect x="48" y="538" width="402" height="140" rx="17" fill="#FFFFFF" stroke="#087D78" stroke-width="1.8"  data-bounds=""/>
      
      <text x="74" y="573" font-size="28" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Earlier support</text>
      <text x="74" y="617" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Two independent explanations</text><text x="74" y="651" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >SUPPORTS M-repeat</text>
      
    </g><g data-node="Later counter-evidence" data-fit="Later counter-evidence">
      <rect x="494" y="538" width="402" height="140" rx="17" fill="#FFFFFF" stroke="#087D78" stroke-width="1.8"  data-bounds=""/>
      
      <text x="520" y="573" font-size="27" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Later counter-evidence</text>
      <text x="520" y="617" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >E-clear-A: reasoned response</text><text x="520" y="651" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >CONTRADICTS M-repeat</text>
      
    </g><polyline data-connector="Earlier evidence supports misconception" points="249,538 249,518 444,518 444,499" fill="none" stroke="#087D78" stroke-width="3" stroke-linejoin="round"  marker-end="url(#learner-memory-teal)"/><polyline data-connector="Later evidence contradicts misconception" points="695,538 695,499" fill="none" stroke="#087D78" stroke-width="3" stroke-linejoin="round"  marker-end="url(#learner-memory-teal)"/><polyline data-connector="Misconception belongs to concept" points="612,355 612,288" fill="none" stroke="#7950AC" stroke-width="3" stroke-linejoin="round"  marker-end="url(#learner-memory-violet)"/><g data-node="Committed learner state" data-fit="Committed learner state">
      <rect x="966" y="200" width="446" height="208" rx="17" fill="#FFFFFF" stroke="#7950AC" stroke-width="1.8"  data-bounds=""/>
      <g aria-hidden="true" transform="translate(991 223) scale(0.625)" color="#345EB4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 5L59 32L32 59L5 32ZM21 32L29 40L45 23"/></g>
      <text x="1048" y="239" font-size="29" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Committed state</text>
      <text x="992" y="292" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >RESOLVING / IMPROVING</text><text x="992" y="329" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Threshold: CANDIDATE</text><text x="992" y="366" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Not CROSSED</text>
      
    </g><polyline data-connector="Policy reduces evidence into state" points="896,410 930,410 930,293 966,293" fill="none" stroke="#7950AC" stroke-width="3" stroke-linejoin="round"  marker-end="url(#learner-memory-violet)"/><g data-node="Next evidence gap" data-fit="Next evidence gap">
      <rect x="966" y="456" width="446" height="108" rx="17" fill="#FFFFFF" stroke="#087D78" stroke-width="1.8" stroke-dasharray="7 6" data-bounds=""/>
      
      <text x="992" y="488" font-size="28" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Next evidence gap</text>
      <text x="992" y="533" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >P-path-B: unused task family</text>
      
    </g><polyline data-connector="Committed state informs next probe" points="1189,408 1189,456" fill="none" stroke="#087D78" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#learner-memory-teal)"/><text x="988" y="606" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >One later clearing response</text><text x="988" y="640" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >is not yet sufficient clearance.</text><rect x="48" y="714" width="1364" height="128" rx="18" fill="#F1F0F8" stroke="#A7B4C5" stroke-width="1.8"  /><text x="76" y="748" font-size="22" font-weight="700" fill="#345EB4" text-anchor="start" dominant-baseline="central" >LEARNING TRAJECTORY</text><text x="76" y="796" font-size="26" font-weight="600" fill="#203047" text-anchor="start" dominant-baseline="central" >Earlier support</text><text x="460" y="796" font-size="26" font-weight="600" fill="#203047" text-anchor="start" dominant-baseline="central" >Later counter-evidence</text><text x="990" y="796" font-size="26" font-weight="600" fill="#203047" text-anchor="start" dominant-baseline="central" >Next: independent probe</text><polyline data-connector="Learning trajectory: retained history" points="310,796 434,796" fill="none" stroke="#526176" stroke-width="3" stroke-linejoin="round"  marker-end="url(#learner-memory-muted)"/><polyline data-connector="Learning trajectory: proposed probe" points="778,796 960,796" fill="none" stroke="#087D78" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#learner-memory-teal)"/><text x="48" y="878" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Synthetic, source-aligned example. Evidence can change state in either direction; this is not a fixed ladder.</text></g>
  </svg>
