<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="706" viewBox="0 0 1460 706" role="img" aria-labelledby="ekalaiva-pillars-title ekalaiva-pillars-desc">
    <title id="ekalaiva-pillars-title">Six source-grounded EKALAIVA teaching ideas</title>
    <desc id="ekalaiva-pillars-desc">An explanatory six-card grouping of pedagogical ideas, not a canonical six-rule constitution: threshold concepts, concept inventories, contextualization, ludic design, contextual challenges, and grand challenges. Each card names an intention from the teaching prompts, not measured learning outcomes or a shipped credentialing feature. Source snapshot 2026-09-30. Original service-style glyphs, not official service logos. Logical source architecture, not a live deployment inventory.</desc>
    <defs><marker id="ekalaiva-pillars-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#345EB4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ekalaiva-pillars-teal" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#087D78" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ekalaiva-pillars-violet" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#7950AC" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ekalaiva-pillars-amber" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#A86B21" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ekalaiva-pillars-red" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#AD454F" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ekalaiva-pillars-muted" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#526176" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></marker>
    </defs>
    <g font-family="'Segoe UI', Arial, sans-serif"><rect x="0" y="0" width="1460" height="706" rx="0" fill="#FAFAF6" stroke="none" stroke-width="1.8"  /><text x="40" y="100" font-size="42" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Six lenses. One learning philosophy.</text><text x="40" y="151" font-size="25" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >A visual reading guide grounded in the active teaching prompts.</text><g data-node="Threshold concepts" data-fit="Threshold concepts">
      <rect x="48" y="196" width="436" height="196" rx="17" fill="#FFFFFF" stroke="#345EB4" stroke-width="1.8"  data-bounds=""/>
      
      <text x="74" y="278" font-size="29" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Threshold concepts</text>
      <text x="74" y="323" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Change the mental model,</text><text x="74" y="357" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >not just the topic.</text>
      
    </g><g aria-hidden="true" transform="translate(73 216) scale(0.5625)" color="#345EB4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 5L59 32L32 59L5 32ZM21 32L29 40L45 23"/></g><text x="453" y="236" font-size="22" font-weight="650" fill="#345EB4" text-anchor="end" dominant-baseline="central" >01</text><g data-node="Concept inventories" data-fit="Concept inventories">
      <rect x="512" y="196" width="436" height="196" rx="17" fill="#FFFFFF" stroke="#087D78" stroke-width="1.8"  data-bounds=""/>
      
      <text x="538" y="278" font-size="29" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Concept inventories</text>
      <text x="538" y="323" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Probe the misconception,</text><text x="538" y="357" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >not only the answer.</text>
      
    </g><g aria-hidden="true" transform="translate(537 216) scale(0.5625)" color="#087D78" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6H50V57L44 52L38 57L32 52L26 57L20 52L14 57ZM23 18H41M23 27H41M23 36H32"/><path d="M35 40L40 45L49 33"/></g><text x="917" y="236" font-size="22" font-weight="650" fill="#087D78" text-anchor="end" dominant-baseline="central" >02</text><g data-node="Contextualization" data-fit="Contextualization">
      <rect x="976" y="196" width="436" height="196" rx="17" fill="#FFFFFF" stroke="#7950AC" stroke-width="1.8"  data-bounds=""/>
      
      <text x="1002" y="278" font-size="29" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Contextualization</text>
      <text x="1002" y="323" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Start in the learner&apos;s world.</text><text x="1002" y="357" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Recover the principle.</text>
      
    </g><g aria-hidden="true" transform="translate(1001 216) scale(0.5625)" color="#7950AC" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="16" r="10"/><path d="M11 57V46C11 29 53 29 53 46V57M23 40V57M41 40V57"/></g><text x="1381" y="236" font-size="22" font-weight="650" fill="#7950AC" text-anchor="end" dominant-baseline="central" >03</text><g data-node="Ludic design" data-fit="Ludic design">
      <rect x="48" y="420" width="436" height="196" rx="17" fill="#FFFFFF" stroke="#7950AC" stroke-width="1.8"  data-bounds=""/>
      
      <text x="74" y="502" font-size="29" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Ludic design</text>
      <text x="74" y="547" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Predict, explore, and play.</text><text x="74" y="581" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >No points required.</text>
      
    </g><g aria-hidden="true" transform="translate(73 440) scale(0.5625)" color="#7950AC" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="25"/><path d="M25 18L46 32L25 46Z"/></g><text x="453" y="460" font-size="22" font-weight="650" fill="#7950AC" text-anchor="end" dominant-baseline="central" >04</text><g data-node="Contextual challenges" data-fit="Contextual challenges">
      <rect x="512" y="420" width="436" height="196" rx="17" fill="#FFFFFF" stroke="#345EB4" stroke-width="1.8"  data-bounds=""/>
      
      <text x="538" y="502" font-size="29" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Contextual challenges</text>
      <text x="538" y="547" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Solve, vary, and explain</text><text x="538" y="581" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >a meaningful problem.</text>
      
    </g><g aria-hidden="true" transform="translate(537 440) scale(0.5625)" color="#345EB4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M38 8A15 15 0 0 0 21 28L6 45L18 57L35 40A15 15 0 0 0 55 22L45 32L33 20Z"/></g><text x="917" y="460" font-size="22" font-weight="650" fill="#345EB4" text-anchor="end" dominant-baseline="central" >05</text><g data-node="Grand challenges" data-fit="Grand challenges">
      <rect x="976" y="420" width="436" height="196" rx="17" fill="#FFFFFF" stroke="#087D78" stroke-width="1.8"  data-bounds=""/>
      
      <text x="1002" y="502" font-size="29" font-weight="650" fill="#203047" text-anchor="start" dominant-baseline="central" >Grand challenges</text>
      <text x="1002" y="547" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Connect ideas across domains.</text><text x="1002" y="581" font-size="24" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Keep the learner in charge.</text>
      
    </g><g aria-hidden="true" transform="translate(1001 440) scale(0.5625)" color="#087D78" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17L47 15M18 21L30 44M45 20L34 44"/><circle cx="12" cy="17" r="7"/><circle cx="51" cy="15" r="7"/><circle cx="32" cy="51" r="7"/></g><text x="1381" y="460" font-size="22" font-weight="650" fill="#087D78" text-anchor="end" dominant-baseline="central" >06</text><text x="48" y="666" font-size="23" font-weight="400" fill="#526176" text-anchor="start" dominant-baseline="central" >Six explanatory lenses, not a new constitution. The active constitution has five commitments.</text></g>
  </svg>
